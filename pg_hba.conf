# If pgpedia_info role exists and
# has LOGIN privilege to database
# pgpedia_info, i.e., datname = rolname
# provide access using
# scram-sha-256 encrypted password
local sameuser pgpedia_info scram-sha-256
# password based authentication
local pgpedia_info pgpedia_info scram-sha-256
local pgpedia_info pgpedia_info md5
# Sends password in clear text over
# the network. DO NOT use this
# authentication record
local pgpedia_info pgpedia_info password
# Never use this authentication record
# in production. Last resort mechanism
local pgpedia_info pgpedia_info trust